async function kd(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(txt,pw,salt){const iv=crypto.getRandomValues(new Uint8Array(12)),k=await kd(pw,salt),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt)));return btoa(String.fromCharCode(...iv,...c))}
async function dec(b,pw,salt){const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),k=await kd(pw,salt);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},k,a.slice(12)))}

function rk(n){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(n));return [...r].map(z=>a[z%a.length]).join('')}

const HASH="fc4624668820c4329492c430d52c8d6da169b06c59278b47e50487cbaba38db0";
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
async function sha(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(z=>z.toString(16).padStart(2,'0')).join('')}
async function doLogin(){let ok=false;const pwv=($('#pw')||{}).value||'';try{ok=(await sha($('#pw').value))==HASH}catch(x){}
 if(ok){U.pw=pwv;await decCourses();U.authed=true;U.login=false;U.admin=true;try{sessionStorage.setItem('adm','1')}catch(x){}render()}else{$('#perr').textContent='Wrong password'}}
const ytid=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);return m?m[1]:''};
async function copy(txt,el){try{await navigator.clipboard.writeText(txt)}catch(x){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(y){}ta.remove()}
 const o=el.textContent;el.textContent=T[U.lang||'en'].copied;setTimeout(()=>{el.textContent=o},1500)}
function resizeImg(f,mx=240){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.85))};im.src=r.result};r.readAsDataURL(f)})}

function chart(list,mo,t){
 const a=list.slice().sort((x,y)=>x.d.localeCompare(y.d)||x.id-y.id),n=a.length;
 const ttl=U.m?mo[U.m-1]+(U.y!='all'?' '+U.y:'')+' '+t.pf:t.perf;
 let c=0,body=`<p class="mut" style="text-align:center;margin:40px 0">${t.no}</p>`;
 if(n){
  const v=a.map(x=>c+=(+x.rr||0));
  const mn=Math.min(0,...v),mx=Math.max(0,...v),raw=((mx-mn)||1)/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(k=>k*mag).find(q=>q>=raw);
  const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step||step;
  const W=640,H=300,l=54,r=16,tp=14,b=30,iw=W-l-r,ih=H-tp-b;
  const X=i=>l+(n>1?i*iw/(n-1):iw/2),Y=y=>tp+(hi-y)/(hi-lo)*ih;
  let g='';for(let y=lo;y<=hi+1e-9;y+=step)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--bd)" stroke-dasharray="3 4"/><text x="${l-8}" y="${Y(y)+4}" text-anchor="end">${num(y)}R</text>`;
  const k=Math.ceil(n/8);for(let i=0;i<n;i+=k)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">#${i+1}</text>`;
  const line=v.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const area=line+`L${X(n-1)} ${Y(0)}L${X(0)} ${Y(0)}Z`;
  const col=c>=0?'var(--win)':'var(--loss)';
  body=`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="min-width:560px;width:100%;direction:ltr;color:${col};font-size:11px;fill:var(--mut)"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".45"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>${g}<line x1="${l}" x2="${W-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" opacity=".5"/><path d="${area}" fill="url(#gr)" stroke="none"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>${v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="${n<40?3.5:6}" fill="${n<40?'currentColor':'transparent'}"><title>#${i+1} · ${esc(a[i].d)} · ${esc(a[i].p)} · ${num(y)}R</title></circle>`).join('')}</svg></div>`;
 }
 return `<div class="card"><div class="ch"><h2 style="margin:0">${ttl}</h2>${n?`<b class="tot ${c>=0?'p':'m'}">${c>0?'+':''}${num(c)}R</b>`:''}</div>${body}</div>`;
}
async function pub(){
 const a=await claude.use('artifact');if(!a)return alert('To publish, open this page while logged in to your Claude account.');
 const c=document.documentElement.cloneNode(true);
 const sd=JSON.parse(JSON.stringify(S));if(!U.pw)return alert('Log in again as admin first.');
 for(const k of sd.courses){if(k.v){k.ev=await enc(JSON.stringify(k.v),U.pw,'adm')}delete k.v}
 c.querySelector('#data').textContent=JSON.stringify(sd).replace(/</g,'\\u003c');
 c.querySelector('#app').innerHTML='';c.setAttribute('lang','en');c.removeAttribute('dir');
 try{await a.publish('<!doctype html>\n'+c.outerHTML)}catch(x){alert('Publish failed: '+(x.message||x.code))}
}

document.addEventListener('click',ev=>{
 if(U.yo&&!ev.target.closest('.yb')){U.yo=false;render()}
 const bb=ev.target.closest('[data-b]');if(bb){hb(bb);return}
 const b=ev.target.closest('[data-lang],[data-m],[data-y],[data-a],[data-del],[data-cp],[data-vid],[data-pdel]');if(!b)return;
 const d=b.dataset;
 if(d.lang){U.lang=d.lang;try{localStorage.setItem('lang',d.lang)}catch(x){}}
 else if(d.m!==undefined)U.m=+d.m;
 else if(d.a=='yo')U.yo=!U.yo;
 else if(d.y!==undefined){U.y=d.y;U.yo=false}
 else if(d.del)S.trades=S.trades.filter(x=>x.id!=d.del);
 else if(d.cp){const p=S.partners.find(z=>z.id==d.cp);if(p&&p.l)copy(p.l,b);return}
 else if(d.vid)U.vid=d.vid;
 else if(d.pdel)S.partners=S.partners.filter(z=>z.id!=d.pdel);
 else if(d.a=='vclose'){if(b.classList.contains('ov')&&ev.target!==b)return;U.vid=null}
 else if(d.a=='ex')U.v='ex';
 else if(d.a=='home')U.v='home';
 else if(d.a=='login'){if(U.authed)U.admin=true;else U.login=true}
 else if(d.a=='lc')U.login=false;
 else if(d.a=='ldo'){doLogin();return}
 else if(d.a=='lout'){U.authed=false;U.admin=false;try{sessionStorage.removeItem('adm')}catch(x){}}
 else if(d.a=='padd')(S.partners=S.partners||[]).push({id:Date.now(),n:'New button',l:'',v:'',i:''});
 else if(d.a=='adm')U.admin=true;
 else if(d.a=='close')U.admin=false;
 else if(d.a=='add')S.trades.push({id:Date.now(),d:new Date().toISOString().slice(0,10),p:'BTC/USDT',dir:'long',r:'win',rr:1});
 else if(d.a=='imp'){const ta=$('#imp');let k=0;(ta?ta.value:'').split('\n').forEach(ln=>{const p=ln.split(',').map(z=>z.trim());if(p.length<5||!/^\d{4}-\d{2}-\d{2}$/.test(p[0]))return;const q=p[3].toLowerCase();S.trades.push({id:Date.now()+(k++),d:p[0],p:p[1],dir:/^s/i.test(p[2])?'short':'long',r:/^w/.test(q)?'win':/^l/.test(q)?'loss':'be',rr:+p[4]||0})});alert(k+' trades imported')}
 else if(d.a=='pub'){pub();return}
 else return;
 render();
});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='pw')doLogin()});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset;
 if(d.a=='lang'){U.lang=el.value;try{localStorage.setItem('lang',el.value)}catch(x){}render()}
 else if(d.a=='year'){U.y=el.value;render()}
 else if(d.cid){const c=S.courses.find(z=>z.id==d.cid);if(c){if(d.ck=='vt')c.v=pv(el.value);else c[d.ck]=el.value}}
 else if(d.pay)S.pay[d.pay]=el.value
 else if(d.cimg){const f=el.files[0];if(f)resizeImg(f,360).then(u=>{const c=S.courses.find(z=>z.id==d.cimg);if(c){c.i=u;render()}})}
 else if(d.pqr){const f=el.files[0];if(f)resizeImg(f,520).then(u=>{S.pay.qr=u;render()})}
 else if(d.s){S[d.s]=d.s=='live'?(+el.value||0):el.value}
 else if(d.pid){const p=S.partners.find(z=>z.id==d.pid);if(p)p[d.pk]=el.value}
 else if(d.pimg){const f=el.files[0];if(f)resizeImg(f).then(u=>{const p=S.partners.find(z=>z.id==d.pimg);if(p){p.i=u;render()}})}
 else if(d.id){const x=S.trades.find(t=>t.id==d.id);if(x)x[d.k]=d.k=='rr'?(+el.value||0):el.value}
});
render();
(async()=>{try{const u=await claude.use('user');if(u&&u.canEdit()&&await claude.use('artifact')){U.can=true;render()}}catch(x){}})();
</script>
